<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Predictions</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
  min-height: 100vh;
}

header {
  background: #0d1b2f;
  padding: 22px 15px;
  text-align: center;
  border-bottom: 2px solid #17395f;
}

header h1 {
  font-size: 26px;
  margin-bottom: 7px;
}

header p {
  color: #9fb3c8;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 15px;
}

.status {
  background: #10243b;
  padding: 13px;
  border-radius: 10px;
  margin-bottom: 15px;
  text-align: center;
  font-size: 14px;
}

.loading {
  color: #ffd166;
}

.success {
  color: #55e89a;
}

.error {
  color: #ff6b6b;
}

.refresh {
  width: 100%;
  border: none;
  background: #1677ff;
  color: white;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 15px;
}

.match {
  background: #0d1b2f;
  border: 1px solid #1c3857;
  border-radius: 14px;
  margin-bottom: 18px;
  overflow: hidden;
}

.league {
  background: #132943;
  padding: 11px 13px;
  color: #9fc5e8;
  font-size: 13px;
}

.teams {
  text-align: center;
  padding: 20px 10px 12px;
}

.home,
.away {
  font-size: 19px;
  font-weight: bold;
}

.vs {
  color: #728aa5;
  font-size: 13px;
  margin: 8px 0;
}

.time {
  color: #9fb3c8;
  font-size: 13px;
  margin-top: 8px;
}

/* SAFE PICK */

.safe-pick {
  margin: 10px 12px 15px;
  padding: 18px 12px;
  border-radius: 13px;
  text-align: center;
  background: #173d32;
  border: 1px solid #2e765e;
}

.safe-title {
  font-size: 13px;
  color: #9ee8c8;
  margin-bottom: 8px;
  font-weight: bold;
}

.safe-choice {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 5px;
}

.safe-confidence {
  font-size: 14px;
  color: #b8d9cc;
}

.predictions {
  padding: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.prediction {
  background: #12253b;
  border-radius: 10px;
  padding: 13px;
  text-align: center;
}

.prediction .title {
  color: #9fb3c8;
  font-size: 12px;
  margin-bottom: 6px;
}

.prediction .value {
  font-size: 21px;
  font-weight: bold;
}

.high {
  color: #55e89a;
}

.medium {
  color: #ffd166;
}

.low {
  color: #ff8585;
}

.empty {
  text-align: center;
  padding: 30px 10px;
  color: #9fb3c8;
}

footer {
  text-align: center;
  color: #71849a;
  font-size: 12px;
  padding: 25px 10px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ Football Predictions</h1>
  <p>Live upcoming matches & predictions</p>
</header>

<div class="container">

  <div id="status" class="status loading">
    Loading matches...
  </div>

  <button class="refresh" onclick="loadMatches()">
    🔄 Refresh Matches
  </button>

  <div id="matches"></div>

</div>

<footer>
  Data provided by football-data.org
</footer>

<script>

const API_URL =
"https://football-over-under-api.onrender.com/api/matches";


async function loadMatches() {

  const status = document.getElementById("status");
  const container = document.getElementById("matches");

  status.className = "status loading";
  status.innerHTML = "⏳ Loading latest matches...";

  container.innerHTML = "";

  try {

    const response = await fetch(API_URL);
    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.message || "Unable to load matches"
      );
    }

    if (!data.matches || data.matches.length === 0) {

      status.className = "status";
      status.innerHTML =
        "No upcoming matches available right now.";

      container.innerHTML = `
        <div class="empty">
          No matches found.
        </div>
      `;

      return;
    }

    status.className = "status success";

    status.innerHTML =
      `✅ ${data.count} upcoming matches available`;

    data.matches.forEach(match => {

      container.innerHTML += createMatch(match);

    });

  } catch (error) {

    console.error(error);

    status.className = "status error";

    status.innerHTML =
      "❌ Could not load matches.";

    container.innerHTML = `
      <div class="empty">
        Please tap Refresh Matches and try again.
      </div>
    `;
  }
}


function createMatch(match) {

  const date = new Date(match.time);

  const dateText =
    date.toLocaleDateString([], {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

  const timeText =
    date.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });


  /*
    We compare the more useful goal-line options.

    Over 0.5 is not used for the SAFE PICK because
    it would dominate every match with the current
    percentage model.
  */

  const options = [

    {
      name: "Over 1.5",
      value: Number(match.over15 || 0)
    },

    {
      name: "Over 2.5",
      value: Number(match.over25 || 0)
    },

    {
      name: "Over 3.5",
      value: Number(match.over35 || 0)
    },

    {
      name: "Under 1.5",
      value: Number(match.under15 || 0)
    },

    {
      name: "Under 2.5",
      value: Number(match.under25 || 0)
    },

    {
      name: "Under 3.5",
      value: Number(match.under35 || 0)
    }

  ];


  options.sort((a, b) => b.value - a.value);

  const safe = options[0];


  return `

    <div class="match">

      <div class="league">
        🏆 ${escapeHTML(match.league)}
        ${match.country
          ? " • " + escapeHTML(match.country)
          : ""}
      </div>


      <div class="teams">

        <div class="home">
          ${escapeHTML(match.home)}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="away">
          ${escapeHTML(match.away)}
        </div>

        <div class="time">
          📅 ${dateText}
          &nbsp; ⏰ ${timeText}
        </div>

      </div>


      <div class="safe-pick">

        <div class="safe-title">
          🛡️ SAFE PICK
        </div>

        <div class="safe-choice">
          ${safe.name}
        </div>

        <div class="safe-confidence">
          Model confidence: ${safe.value}%
        </div>

      </div>


      <div class="predictions">

        ${predictionBox(
          "Over 0.5",
          match.over05
        )}

        ${predictionBox(
          "Over 1.5",
          match.over15
        )}

        ${predictionBox(
          "Over 2.5",
          match.over25
        )}

        ${predictionBox(
          "Over 3.5",
          match.over35
        )}

        ${predictionBox(
          "Under 1.5",
          match.under15
        )}

        ${predictionBox(
          "Under 2.5",
          match.under25
        )}

        ${predictionBox(
          "Under 3.5",
          match.under35
        )}

      </div>

    </div>

  `;
}


function predictionBox(title, value) {

  const number = Number(value || 0);

  let className = "medium";

  if (number >= 70) {
    className = "high";
  }

  if (number < 40) {
    className = "low";
  }

  return `

    <div class="prediction">

      <div class="title">
        ${title}
      </div>

      <div class="value ${className}">
        ${number}%
      </div>

    </div>

  `;
}


function escapeHTML(text) {

  if (!text) return "";

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


loadMatches();

</script>

</body>
</html>
